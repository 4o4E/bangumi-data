name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bangumi_test
          POSTGRES_USER: bangumi
          POSTGRES_PASSWORD: bangumi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bangumi -d bangumi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Normalize image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Validate release tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "发布标签必须是带 v 前缀的 SemVer，例如 v1.2.3" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and prepare image files
        env:
          BANGUMI_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/bangumi_test
          BANGUMI_TEST_POSTGRES_USER: bangumi
          BANGUMI_TEST_POSTGRES_PASSWORD: bangumi
        run: ./gradlew test prepareDockerContext --no-daemon

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/bangumi-data:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER_LC }}/bangumi-data:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Docker 镜像

            ```text
            ghcr.io/${{ env.OWNER_LC }}/bangumi-data:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER_LC }}/bangumi-data:latest
            ```
